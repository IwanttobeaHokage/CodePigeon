<!doctype html>
<meta charset="utf-8">
<title>CodePigeon 설정</title>
<body style="font-family: sans-serif; max-width: 420px; margin: 24px auto; display: grid; gap: 10px">
  <h3>깃허브 설정</h3>
  <label>토큰 (Contents: Read and write) <input id="token" autocomplete="off" spellcheck="false" style="width:100%; -webkit-text-security: disc"></label>
  <label>저장소 (아이디/저장소명) <input id="repo" placeholder="myname/programmers" style="width:100%"></label>
  <label>브랜치 <input id="branch" placeholder="main" style="width:100%"></label>
  <button id="save">저장</button>
  <span id="msg"></span>
  <script src="options.js"></script>
</body>
